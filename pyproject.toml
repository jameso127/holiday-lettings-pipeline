[project]
name = "holiday-lettings"
version = "0.1.0"
description = "dbt + DuckDB pipeline that cleans holiday-letting bookings and summarises them per property."
requires-python = ">=3.10"
dependencies = [
    "dbt-duckdb==1.11.1",
]

[dependency-groups]
dev = [
    "duckdb-cli==1.5.6",
    "sqlfluff==4.4.0",
    "sqlfluff-templater-dbt==4.4.0",
]

[tool.uv]
package = false
