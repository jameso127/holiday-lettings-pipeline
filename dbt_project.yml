name: holiday_lettings
version: "1.0.0"
config-version: 2
profile: holiday_lettings

model-paths: ["models"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  holiday_lettings:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      # Written to output/<model>.parquet (external_root in profiles.yml), plus a CSV copy.
      +materialized: external
      +format: parquet
      +post-hook: "copy (select * from {{ this }}) to 'output/{{ this.name }}.csv' (header, delimiter ',')"
