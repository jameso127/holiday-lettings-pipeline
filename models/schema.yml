version: 2

models:
  - name: stg_bookings
    description: Trimmed, typed and standardised bookings. No business logic.
    columns:
      - name: booking_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [completed, cancelled, pending]

  - name: bookings_clean
    description: >
      Final clean dataset, one row per booking. Missing check-in, rate or total are derived from
      total = daily rate x nights where the other two values are known; otherwise left NULL.
      Exported to output/bookings_clean.parquet.
    columns:
      - name: booking_id
        data_tests: [unique, not_null]
      - name: property_name
        data_tests: [not_null]
      - name: check_out_date
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [completed, cancelled, pending]
      - name: nights
        description: Length of stay in days (check_out_date - check_in_date). NULL when check-in cannot be derived.
      - name: is_check_in_imputed
        description: check_in_date derived as check_out_date - (total_booking_value / daily_rate_usd).
      - name: is_rate_imputed
        description: daily_rate_usd derived as total_booking_value / nights.
      - name: is_total_imputed
        description: total_booking_value derived as daily_rate_usd x nights.

  - name: property_summary
    description: One row per property. Exported to output/property_summary.parquet.
    columns:
      - name: property_name
        data_tests: [unique, not_null]
      - name: total_revenue_usd
        description: Sum of booking value for completed bookings only.
      - name: avg_length_of_stay_days
        description: Average nights across completed bookings with a known length of stay.
